name: Desktop checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Bootstrap on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: call start.bat --check
      - name: Bootstrap on macOS and Linux
        if: runner.os != 'Windows'
        run: WHATNOT_PYTHON="$(command -v python)" sh start.sh --check
      - name: Install Linux browser libraries
        if: runner.os == 'Linux'
        run: .venv/bin/python -m playwright install-deps chromium
      - name: Run Windows tests
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          .venv\Scripts\python.exe -m pip install -r requirements-dev.txt || exit /b 1
          .venv\Scripts\python.exe -m pytest -q tests
      - name: Run macOS tests
        if: runner.os == 'macOS'
        run: |
          .venv/bin/python -m pip install -r requirements-dev.txt
          # Run the native Tk window and WebRTC loopback fixtures on a Mac desktop.
          .venv/bin/python -m pytest -q -o faulthandler_timeout=45 tests \
            --ignore=tests/test_tk_scroll.py \
            -k 'not local_webrtc_without_audio_dom_and_dom_priority and not remote_audio_original_survives_partial_start_cleanup'
      - name: Run Linux tests
        if: runner.os == 'Linux'
        run: |
          .venv/bin/python -m pip install -r requirements-dev.txt
          xvfb-run -a .venv/bin/python -m pytest -q tests
